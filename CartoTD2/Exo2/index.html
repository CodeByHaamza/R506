<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carto TD2 — Exo 2</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e3e6ea; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --text:#e8eaed; --muted:#9aa1ab; --line:#262b34; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text);
    font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width:720px; margin:0 auto; }
  a.back { display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-size:0.9rem; }
  a.back:hover { text-decoration:underline; }
  h1 { margin:0 0 6px; font-size:1.35rem; }
  .sub { margin:0 0 24px; color:var(--muted); font-size:0.9rem; }
  #app {
    min-height:320px; padding:18px; background:var(--card);
    border:1px dashed var(--line); border-radius:12px; color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">&lsaquo; Retour aux exercices</a>
  <h1>Carto TD2 — Exercice 2</h1>
  <p class="sub">R506 · Hamza Karrouchi · BUT INFO 3 ALT</p>
  <div id="app">Exercice a realiser.</div>
</div>
<script src="script.js"></script>
</body>
</html>
